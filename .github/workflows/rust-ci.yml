name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    tags:
      - '*'
jobs:
  build:
    name: Rust Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # --workspace, or clippy lints only the root package — a thin re-export shell with no
        # code of its own, which made this step pass on anything.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run audit
        # Ignored advisories are configured in .cargo/audit.toml (all
        # transitive via the typst/pdf dependency chain and not fixable
        # without an upstream release). See that file for per-advisory
        # rationale.
        run: cargo audit