[advisories]
ignore = [
    # paste 1.0.15 — unmaintained. Pulled in transitively via rxing/typst
    # (imageproc → nalgebra → simba → paste, image → rav1e → paste, etc.).
    # No active CVE; re-evaluate when upstream crates migrate off paste.
    "RUSTSEC-2024-0436",
    # yaml-rust 0.4.5 — unmaintained. Pulled in transitively via
    # typst-library → syntect → yaml-rust. No active CVE; re-evaluate
    # when syntect switches to yaml-rust2 or an alternative.
    "RUSTSEC-2024-0320",
    # bincode 1.3.3 — unmaintained. Pulled in transitively via
    # typst-library → syntect → bincode. No active CVE; re-evaluate
    # when syntect upgrades to bincode 2.x.
    "RUSTSEC-2025-0141",
    # quick-xml 0.38.4 — memory-exhaustion DoS via unbounded namespace
    # declarations in NsReader. Pulled in transitively via
    # typst-library → hayagriva → citationberg, which pins quick-xml 0.38
    # (latest citationberg 0.7.0 still does), so we cannot upgrade to the
    # fixed >=0.41.0 without an upstream release. Only reachable behind the
    # `pdf` feature when parsing bibliography/CSL XML, which is trusted
    # template content in our usage. Re-evaluate when citationberg bumps
    # quick-xml.
    "RUSTSEC-2026-0195",
    # quick-xml 0.38.4 — quadratic run time when checking a start tag for
    # duplicate attribute names. Same transitive source and mitigation as
    # RUSTSEC-2026-0195 above.
    "RUSTSEC-2026-0194",
    # rustybuzz 0.20.1 — unmaintained. Pulled in transitively via
    # typst-library (text shaping). No active CVE; re-evaluate when typst
    # migrates to a maintained successor.
    "RUSTSEC-2026-0206",
    # ttf-parser 0.25.1 — unmaintained. Pulled in transitively via
    # typst-library / rustybuzz (font parsing). No active CVE; re-evaluate
    # when typst migrates off it.
    "RUSTSEC-2026-0192",
]
