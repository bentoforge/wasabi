[package]
name = "wasabi-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
futures-util = "0.3"
futures = "0.3"
async-stream = "0.3"
tokio-util = "0.7"
warp = { version = "0.4", features = ["server"] }
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde_urlencoded = "0.7.1"
chrono = { version = "0.4", features = ["serde"] }
aws-config = { version = "1.8", features = ["behavior-version-latest"], optional = true }
# default-features = false drops the legacy `rustls` feature (which pulls
# rustls-webpki 0.101 with known CVEs); `default-https-client` is the
# modern replacement pulling rustls 0.23 / hyper-rustls 0.27.
aws-sdk-s3 = { version = "1.117", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-dynamodb = { version = "1.98", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
serde_dynamo = { version = "4.2", optional = true, features = ["aws-sdk-dynamodb+1"] }
aws-sdk-firehose = { version = "1.99", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-bedrockruntime = { version = "1.120", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-smithy-types = { version = "1.3", optional = true }
nanoid = { version = "0.4" }
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
opentelemetry-semantic-conventions = { version = "0.31", features = ["semconv_experimental"] }
tracing-opentelemetry = { version = "0.32", optional = true }
opentelemetry = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", features = ["tonic", "grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
jwks = { version = "0.5", default-features = false, features = ["aws_lc_rs"] }
# default-features = false drops the HTTP/3 chain (quinn / quinn-proto)
# which we don't use — it kept landing in the lockfile via reqwest's
# default features and triggering cargo audit on quinn CVEs we never run.
# Keep the explicit list minimal: rustls TLS (matches jsonwebtoken /
# jwks aws_lc_rs posture), HTTP/2, and charset sniffing for JWKS body.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
arc-swap = "1.7"
nu-ansi-term = { version = "0.50", optional = true }
rand = "0.9"
percent-encoding = "2.3.2"
async-trait = { version = "0.1" }
bytesize = "2.3"
opensearch = { version = "2.3", optional = true }
regex = "1.11"
base64 = "0.22.1"
typst = { version = "=0.14.2", optional = true }
typst-pdf = { version = "=0.14.2", optional = true }
typst-kit = { version = "=0.14.2", features = ["embed-fonts"], optional = true }
fast_qr = { version = "0.12", features = ["svg"], optional = true }
rxing = { version = "0.8", default-features = false, features = ["image", "image_formats", "encoding_rs"], optional = true }
thiserror = { version = "2.0", optional = true }
comemo = { version = "0.4", optional = true }

[dev-dependencies]
mock_instant = "0.6"
warp = { version = "0.4", features = ["test"] }

[features]
default = []
pretty_logs = ["nu-ansi-term"]
open_telemetry = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "tracing-opentelemetry"]
aws_s3 = ["aws-config", "aws-sdk-s3"]
aws_dynamodb = ["aws-config", "aws-sdk-dynamodb", "serde_dynamo"]
aws_firehose = ["aws-config", "aws-sdk-firehose"]
aws_bedrock = ["aws-config", "aws-sdk-bedrockruntime", "aws-smithy-types"]
open_search = ["opensearch"]
pdf = ["typst", "typst-pdf", "typst-kit", "fast_qr", "rxing", "thiserror", "comemo", "reqwest/blocking"]